<title>MoliNotes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,700;12..96,800&family=Lora:wght@400;600;700&family=Caveat:wght@400;600;700&family=JetBrains+Mono:wght@400;600&family=Atkinson+Hyperlegible:wght@400;700&family=Nunito:wght@400;600;700;800&family=Lexend:wght@400;600;700&family=Playfair+Display:wght@400;600;700&family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Courier+Prime:wght@400;700&family=Pixelify+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#171719;--surface:#26262A;--ink:#F2F2F3;--muted:#9A9AA2;--line:#34343A;--note:#B51224;--note-hover:#C8182C;--note-muted:rgba(255,255,255,.78);--note-line:rgba(255,255,255,.3);--danger:#FF8A7A;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
:root{--nf:"Bricolage Grotesque",system-ui,sans-serif;--ns:1}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",sans-serif}

button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
svg.i{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.hidden{display:none!important}
.drawer{position:fixed;z-index:25;top:0;left:0;bottom:0;width:min(300px,82%);background:var(--bg);border-right:1px solid var(--line);padding:calc(16px + env(safe-area-inset-top,0px)) 12px calc(16px + env(safe-area-inset-bottom,0px));overflow-y:auto;transform:translateX(-102%);transition:transform .2s}
.drawer.open{transform:none}
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:24}
.brand{font-size:24px;font-weight:700;padding:8px 16px 16px}
.nav{display:flex;align-items:center;gap:20px;width:100%;height:50px;padding:0 18px;border-radius:999px;text-align:left}
.nav span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nav:hover{background:var(--surface)}
.nav[aria-current="true"]{background:var(--note);color:#fff;font-weight:600}
.sep{height:1px;background:var(--line);margin:10px 12px}
.sec{display:flex;justify-content:space-between;align-items:center;padding:6px 16px;color:var(--muted);font-size:14px}
.sec button{color:var(--ink);padding:12px 10px;min-height:44px;border-radius:8px}
.lrow{display:flex;align-items:center;gap:12px;height:50px;padding:0 6px 0 18px}
.lrow input{flex:1;min-width:0;background:none;border:0;border-bottom:1px solid var(--line);padding:6px 2px;outline:none}

.main{min-height:100vh}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:var(--bg);display:flex;align-items:center;gap:8px;padding:10px 12px}
.menu{padding:10px;border-radius:50%}
.menu:hover{background:var(--surface)}
.search{flex:1;min-width:0;display:flex;align-items:center;gap:10px;background:var(--surface);border-radius:999px;padding:0 16px;height:48px;max-width:720px;margin:0 auto}
.search input{flex:1;min-width:0;background:none;border:0;outline:none}
.search:focus-within{box-shadow:0 0 0 2px var(--ink)}
.wrap{max-width:1000px;margin:0 auto;padding:4px 14px 110px}
h1{font-size:22px;margin:8px 4px 12px}
.h2{color:var(--muted);font-size:14px;margin:14px 4px 8px}
.grid{column-width:230px;column-gap:12px}
.card{position:relative;break-inside:avoid;margin:0 0 12px;background:var(--c,#171719);border:1px solid rgba(255,255,255,.16);color:#fff;border-radius:16px;padding:14px 16px;display:block;width:100%;transition:transform .15s,box-shadow .15s,filter .15s}
.card[role="button"]{cursor:pointer}
.card[role="button"]:hover{transform:translateY(-2px);box-shadow:0 10px 24px rgba(0,0,0,.45);filter:brightness(1.12)}
.card b{display:block;font-family:var(--nf);font-size:calc(18px*var(--ns));font-weight:700;line-height:1.3;margin-bottom:6px;overflow-wrap:anywhere}
.card p{margin:0;font-family:var(--nf);font-size:calc(15.5px*var(--ns));line-height:1.55;color:var(--note-muted);white-space:pre-wrap;overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:8;-webkit-box-orient:vertical;overflow:hidden}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.tag{display:inline-flex;align-items:center;gap:4px;border:1px solid var(--note-line);border-radius:999px;padding:1px 10px;font-size:13px;color:#fff;background:rgba(0,0,0,.18)}
.tag button{padding:0;line-height:0}
.tag svg{width:14px;height:14px}
.acts{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.btn{border-radius:10px;padding:11px 16px;min-height:44px;background:var(--surface);color:var(--ink)}
.btn:hover{background:var(--line)}
.btn.pri{background:var(--note);color:#fff;font-weight:600}
.btn.warn{color:var(--danger)}
.empty{text-align:center;color:var(--muted);padding:70px 20px}
.empty svg{width:72px;height:72px;opacity:.5;margin-bottom:10px}
.fab{position:fixed;right:20px;bottom:calc(20px + env(safe-area-inset-bottom,0px));width:58px;height:58px;border-radius:18px;background:var(--note);color:#fff;display:grid;place-items:center;box-shadow:0 6px 18px rgba(0,0,0,.5);z-index:12}
.fab:hover{background:var(--note-hover)}
.fab svg{width:30px;height:30px}
.modal{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;padding:16px 16px calc(16px + var(--th,0px))}
.ed{background:var(--c,#171719);border:1px solid rgba(255,255,255,.2);color:#fff;border-radius:16px;width:min(620px,100%);max-height:100%;display:flex;flex-direction:column;overflow:hidden}
.ed .row{display:flex;align-items:center;gap:4px;padding:8px 10px}
.ed .sp{flex:1}
.sw{display:flex;flex-wrap:wrap;gap:10px;padding:4px 18px 10px}
.swb{width:44px;height:44px;border-radius:50%;border:2px solid rgba(255,255,255,.45);display:grid;place-items:center;color:#fff}
.swb svg{width:16px;height:16px;display:none}
.swb[aria-pressed="true"]{box-shadow:0 0 0 2px #fff;border-color:transparent}
.swb[aria-pressed="true"] svg{display:block}
.ib{padding:10px;min-width:44px;min-height:44px;border-radius:50%;display:grid;place-items:center}
.ib:hover{background:rgba(255,255,255,.18)}
.ib[aria-pressed="true"]{background:rgba(255,255,255,.28)}
.ed input.t{background:none;border:0;outline:none;font-family:var(--nf);font-size:calc(26px*var(--ns));font-weight:700;padding:4px 18px;width:100%}
.ed textarea{background:none;border:0;outline:none;resize:none;padding:6px 18px;min-height:30vh;flex:1;line-height:1.6;font-family:var(--nf);font-size:calc(17px*var(--ns))}
.ed ::placeholder{color:var(--note-muted)}
.ed .tags{padding:0 18px;margin:4px 0 8px}
.ed .foot{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:4px 12px;padding:8px 18px;font-size:13px;color:var(--note-muted);border-top:1px solid var(--note-line)}
.pick{background:var(--bg);color:var(--ink);border:1px solid var(--line);margin:0 12px 10px;border-radius:12px;padding:10px;max-height:240px;overflow:auto}
.pick input{width:100%;background:var(--surface);border:0;outline:none;border-radius:8px;padding:8px 10px;margin-bottom:6px}
.pick .o{display:flex;align-items:center;gap:10px;width:100%;min-height:44px;text-align:left;padding:8px;border-radius:8px}
.pick .o:hover{background:var(--surface)}
.box{width:20px;height:20px;border:2px solid var(--muted);border-radius:5px;display:grid;place-items:center;flex:none}
.box.on{background:var(--note);border-color:var(--note)}
.box svg{width:14px;height:14px;display:none}
.box.on svg{display:block}
.xs{background:var(--bg);border-radius:14px;padding:16px;width:min(560px,100%);display:flex;flex-direction:column;gap:10px;max-height:100%;border:1px solid var(--line);overflow:auto}
.xs h2{margin:0;font-size:20px}
.xs p{margin:0;color:var(--muted);font-size:14px}
.xs textarea{min-height:200px;flex:1;background:var(--surface);border:0;border-radius:10px;padding:10px;resize:none;font-size:14px}
.xs .r{display:flex;gap:8px;flex-wrap:wrap}
.splash{position:fixed;inset:0;z-index:60;background:var(--bg);display:flex;align-items:center;justify-content:center;overflow:hidden;transition:opacity .45s,transform .45s}
.splash.out{opacity:0;transform:scale(1.04);pointer-events:none}
 .bgs{position:absolute;inset:0;overflow:hidden;pointer-events:none}
.bread-bands{position:absolute;left:-65%;top:-55%;width:230%;height:210%;display:flex;flex-direction:column;justify-content:space-around;transform:rotate(-34deg);transform-origin:center;animation:bread-drift 34s linear infinite;will-change:transform}
.bread-row{height:clamp(66px,10vh,112px);display:flex;align-items:center;gap:clamp(18px,4vw,54px);width:max-content;white-space:nowrap;opacity:.18}
.bread-row:nth-child(even){margin-left:-90px;opacity:.13}
.bread-row svg{width:clamp(54px,8vw,92px);height:clamp(54px,8vw,92px);flex:none;stroke:#777780;stroke-width:1.7;fill:#777780;fill-opacity:.10;transform:rotate(34deg)}
@keyframes bread-drift{from{translate:0 0}to{translate:-180px 0}}
@media (prefers-reduced-motion:reduce){.bread-bands{animation:none;transform:rotate(-34deg)}}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes bob{from{transform:translateY(-4px)}to{transform:translateY(4px)}}
.hero{position:relative;text-align:center;padding:24px;animation:rise .8s ease both}
.lhead{position:relative;width:240px;margin:0 auto}
.lhead::before{content:"";position:absolute;left:50%;top:52%;width:340px;height:340px;transform:translate(-50%,-50%);background:radial-gradient(circle,rgba(209,42,74,.3),transparent 62%);pointer-events:none}
.lface{position:relative;display:block;width:240px;height:200px;image-rendering:pixelated;animation:bob 2.8s ease-in-out infinite alternate}
@media (max-width:359px){.lhead,.lface{width:144px}.lface{height:120px}}
.hero h1{font-size:clamp(38px,10vw,58px);margin:14px 0 6px;letter-spacing:-.5px}
.hero p{margin:0;color:var(--muted);font-size:18px}
.enter{margin-top:30px;background:var(--note);color:#fff;border-radius:999px;padding:14px 44px;font-weight:600;font-size:18px;box-shadow:0 6px 18px rgba(0,0,0,.45)}
.enter:hover{background:var(--note-hover)}
.items{padding:2px 18px 8px;flex:1;overflow:auto;min-height:30vh}

.irow input{flex:1;min-width:0;background:none;border:0;outline:none;padding:6px 2px;font-family:var(--nf);font-size:calc(17px*var(--ns))}
.irow input::placeholder{color:var(--note-muted)}
.irow.done input{text-decoration:line-through;color:var(--note-muted)}
.irow .ib{opacity:.55;padding:10px}
.irow .ib svg{width:20px;height:20px}
.cbx{width:44px;height:44px;border:0;background:none;display:grid;place-items:center;flex:none;margin:0}
.bx2{width:22px;height:22px;border:2px solid var(--note-muted);border-radius:6px;display:grid;place-items:center;color:transparent}
.bx2 svg{width:14px;height:14px}
.irow.done .bx2{background:#fff;border-color:#fff;color:#111}
.idone{color:var(--note-muted);font-size:13px;margin:10px 0 4px}
.cl{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.cl li{display:flex;gap:9px;align-items:flex-start;color:var(--note-muted);overflow-wrap:anywhere;font-family:var(--nf);font-size:calc(15.5px*var(--ns));line-height:1.4}
.cl .bx{width:15px;height:15px;border:1.8px solid var(--note-muted);border-radius:4px;flex:none;margin-top:3px}
.cl .more{font-size:13px;padding-left:24px;opacity:.85}
.cmeta{margin-top:10px;font-size:12px;color:var(--note-muted);opacity:.85}
.cpin{position:absolute;top:10px;right:10px;color:var(--note-muted)}
.cpin svg{width:16px;height:16px;fill:currentColor}
.card.pinned b{padding-right:22px}
.fab2{right:27px;bottom:calc(92px + env(safe-area-inset-bottom,0px));width:44px;height:44px;border-radius:14px;background:var(--surface);color:var(--ink)}
.fab2:hover{background:var(--line)}
.fab2 svg{width:22px;height:22px}
.fonts{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px}
.fopt{padding:12px;border-radius:12px;background:var(--surface);font-size:18px}
.fopt[aria-pressed="true"],.btn[aria-pressed="true"]{box-shadow:inset 0 0 0 2px var(--ink)}
.prev{border:1px solid rgba(255,255,255,.16);border-radius:14px;padding:14px 16px;background:var(--bg)}
.prev b{display:block;font-family:var(--nf);font-size:calc(18px*var(--ns));margin-bottom:4px}
.prev p{margin:0;color:var(--ink);font-family:var(--nf);font-size:calc(15.5px*var(--ns));line-height:1.55}
.toast{position:fixed;left:12px;right:92px;bottom:calc(16px + env(safe-area-inset-bottom,0px));max-width:560px;z-index:50;background:#2A2A30;color:var(--ink);border:1px solid var(--line);border-radius:14px;padding:12px 14px;display:flex;flex-wrap:wrap;align-items:center;gap:8px 10px;box-shadow:0 10px 30px rgba(0,0,0,.5)}
.toast span{flex:1 1 220px}
.fs.error{color:#fff;font-weight:700;background:rgba(0,0,0,.4);padding:0 8px;border-radius:8px}
.fs.saving{opacity:.8}
.tag button{position:relative}
.tag button::after{content:"";position:absolute;inset:-14px -10px}
.wrap:focus{outline:none}
@media (min-width:900px){
  .drawer{transform:none}
  .scrim,.menu{display:none!important}
  .main{margin-left:300px}
  .top{padding-left:24px}
}
@media (max-width:620px){
  .modal{padding:env(safe-area-inset-top,0px) 0 calc(env(safe-area-inset-bottom,0px) + var(--th,0px))}
  .ed{width:100%;height:100%;border-radius:0}
}
@media (prefers-reduced-motion:reduce){.drawer{transition:none}.bg,.bg svg,.hero,.lface{animation:none}.bg{top:var(--ty)}.splash{transition:none}}

  });
  for (y = 5; y <= 21; y++) for (x = 8; x <= 40; x++){   // flequillo en puntas
    var a = (x - 24) / 15.4, b = (y - 19) / 13.6; if (a * a + b * b > 1) continue;
    var by = 15.5 + Math.abs(((x - 9) % 7) - 3.5) * 1.15;
    if (Math.abs(x - 24) < 1 && y > 13) continue;
    if (y <= by) px(x,y,((x + y) % 7 === 0 && y < 13) ? TC.hairL : TC.hair);
  }
  for (x = 32; x <= 39; x++) for (y = 4 + ((x - 32) % 2 ? 2 : 0) + (x > 36 ? 0 : 1); y <= 11; y++) px(x,y,TC.white);   // lazo blanco
  var tw = Math.sin(t * 3.1) * 0.6, wob = st.a ? 1.4 : 0;   // ahoge con gancho
  var P = [[24,7],[24,5],[24,4],[25,3],[26,2],[27,1],[28,1],[29,1],[30,2],[30,3]];
  P.forEach(function(p,i){ var k = i / (P.length - 1); px(p[0] + (tw + wob) * k,p[1],TC.hair); px(p[0] + 1 + (tw + wob) * k,p[1],TC.hair); });
  function eye(x0,y0){
    var i;
    if (st.e === 'blink'){ for (i = 0; i < 7; i++) px(x0 + i,y0 + 4 - (i === 0 || i === 6 ? 1 : 0),TC.out); return; }
    if (st.e === 'happy'){ [[0,5],[1,4],[2,3],[3,3],[4,3],[5,4],[6,5]].forEach(function(p){ px(x0 + p[0],y0 + p[1],TC.out); px(x0 + p[0],y0 + p[1] + 1,TC.out); }); return; }
    EYE.forEach(function(row,j){ row.split('').forEach(function(ch,k){
      var c = ch === '#' ? TC.out : ch === 'r' ? TC.irisT : ch === 'R' ? TC.irisB : ch === 'p' ? TC.pupil : ch === 'h' ? TC.white : null;
      if (c) px(x0 + k,y0 + j,c);
    }); });
  }
  eye(15,19); eye(27,19);
  [14,15,16,32,33,34].forEach(function(bx){ px(bx,28,TC.blush); });
  if (st.m === 'smile'){ [[21,29],[22,30],[23,30],[24,30],[25,30],[26,30],[27,29]].forEach(function(p){ px(p[0],p[1],TC.mouth); }); px(22,31,TC.white); }
  else if (st.m === 'talk'){ ell(24,30,2.4,1.9,TC.mouth); px(22,29,TC.white); px(24,31,TC.tongue); }
  else { ell(24,30.2,4.2,2.8,TC.mouth); for (x = 21; x <= 27; x++) px(x,28,TC.white); px(20,29,TC.white); px(28,29,TC.white); ell(24,32,2.2,0.8,TC.tongue); }
  for (y = 1; y < TH; y++) for (x = 0; x < TW; x++)   // sombra de la piel bajo el flequillo
    if (g[y][x] === TC.skin && (g[y - 1][x] === TC.hair || g[y - 1][x] === TC.hairL)) g[y][x] = TC.skinS;
  var o = g.map(function(r){ return r.slice(); });   // contorno grueso
  for (y = 0; y < TH; y++) for (x = 0; x < TW; x++) if (!g[y][x]){
    if ((y > 0 && g[y - 1][x]) || (y < TH - 1 && g[y + 1][x]) || (x > 0 && g[y][x - 1]) || (x < TW - 1 && g[y][x + 1])) o[y][x] = TC.out;
  }
  return o;
}
function drawTeto(c,st,t){
  var g = tetoGrid(st,t), x, y; c.clearRect(0,0,TW,TH);
  for (y = 0; y < TH; y++) for (x = 0; x < TW; x++) if (g[y][x]){ c.fillStyle = g[y][x]; c.fillRect(x,y,1,1); }
}
var anim = {on:false, t:null, b:null, r:null};
function stopLogoAnim(){ anim.on = false; clearTimeout(anim.t); clearTimeout(anim.b); clearInterval(anim.r); }
function startLogoAnim(){
  $('logo').innerHTML = '<div class="lhead" aria-hidden="true"><canvas class="lface" width="48" height="40"></canvas></div>';
  var ctx = document.querySelector('.lface').getContext('2d'), st = {m:'smile', e:'open', a:0}, k = 0;
  if (window.matchMedia('(prefers-reduced-motion: reduce)').matches){ drawTeto(ctx,st,0); return; }
  anim.on = true;
  var t0 = performance.now();
  anim.r = setInterval(function(){ drawTeto(ctx,st,(performance.now() - t0) / 1000); },80);
  drawTeto(ctx,st,0);
  function step(){   // ciclo de 4,4 s: sonríe, habla y se ríe
    if (!anim.on) return;
    var c = k % 40;
    if (c < 12){ st.m = 'smile'; st.e = 'open'; }
    else if (c < 26){ st.m = (c % 2) ? 'talk' : 'smile'; st.e = 'open'; if (c % 4 === 0) st.a = 1 - st.a; }
    else { st.m = 'grin'; st.e = 'happy'; }
    k++; anim.t = setTimeout(step,110);
  }
  function blink(){
    if (!anim.on) return;
    if (st.e === 'open'){ st.e = 'blink'; setTimeout(function(){ if (st.e === 'blink') st.e = 'open'; },130); }
    anim.b = setTimeout(blink,1800 + Math.random() * 2600);
  }
  step(); anim.b = setTimeout(blink,1500);
}

  if (e.key !== KEY || e.newValue == null) return;
